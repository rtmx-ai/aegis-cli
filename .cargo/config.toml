# REQ-BUILD-061: Local build acceleration
#
# Baseline (16 vCPU, no acceleration): clean=106s, pre-commit hook=113s
# Target: pre-commit hook < 60s on 16 vCPU, < 40s on 32 vCPU
#
# Prerequisites:
#   brew install sccache
#   brew install mold        # Linux only; macOS uses default linker
#
# sccache caches compilation artifacts across cargo invocations.
# On macOS, split-debuginfo=unpacked avoids re-linking debug info.

[build]
# Use all available CPUs. Cargo auto-detects, but this makes it explicit.
# Works on both 16 vCPU and 32 vCPU machines without per-machine config.
#jobs = 16  # Uncomment and set to override auto-detection

# sccache wraps rustc to cache compilation results.
# Install: brew install sccache (or cargo install sccache)
# Comment out if sccache is not installed.
#rustc-wrapper = "sccache"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.x86_64-unknown-linux-musl]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# macOS: use default linker (Apple ld is already fast with -dead_strip).
# split-debuginfo=unpacked avoids bundling .dSYM on every incremental build.
[target.aarch64-apple-darwin]
rustflags = ["-C", "split-debuginfo=unpacked"]

# REQ-BUILD-070: aarch64 Linux musl cross-compilation linker.
# Uses the aarch64-linux-gnu-gcc cross-compiler to link musl-targeted binaries.
# Install: sudo apt-get install gcc-aarch64-linux-gnu
[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-apple-darwin]
rustflags = ["-C", "split-debuginfo=unpacked"]
