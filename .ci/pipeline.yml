# .ci/pipeline.yml — canonical pipeline STAGE description (CLAUDE.md §3).
#
# This is a DECLARATIVE description of the pipeline stages and their hard gates.
# It documents what `make ci` implements; the Makefile is the single source of
# truth and the actual executor (GitHub Actions and the pre-push hook both run
# `make ci`). Keep this file consistent with the Makefile `ci` target — if they
# drift, fix one of them (CLAUDE.md §8: don't let doc and code diverge).

pipeline: aegis-cli
source_of_truth: Makefile        # `make ci` is the executable pipeline
runners:
  - github-actions: .github/workflows/ci.yml   # OS matrix: linux runs `make ci`, macOS runs `make ci-darwin`
  - git-hook: pre-push                          # runs `make ci`
  - git-hook: pre-commit                        # runs `make ci-fast` (fast subset)

# OS matrix validates both ship targets (CLAUDE.md §2). The linux leg runs the
# full `make ci` incl. the netns egress gate (the real EGRESS=0 ITAR proof). The
# macOS leg runs `make ci-darwin` (= `make ci` minus airgap) for darwin-metal
# build/test parity — verify-airgap.sh's netns/ss proof is linux-only, so the
# egress gate is enforced on the linux enclave host + linux CI leg, never on macOS.
os_matrix:
  - os: ubuntu-latest   # linux-cpu — full `make ci`, fail-closed airgap (AIRGAP_STRICT=1)
  - os: macos-latest    # darwin-metal — `make ci-darwin` (no linux-only airgap step)

# Ordered stages. Each maps to make targets composed by `make ci`.
stages:
  - id: build
    name: Reproducible offline build
    make: [fmt-check, lint, vet, build]
    description: >
      gofmt-clean check, golangci-lint (govet/staticcheck/ineffassign/errcheck/
      unused/gofmt/gosimple/misspell), go vet, and an offline/vendored build of
      the static aegis binary. No network fetch (BUILD-001). lint also runs in
      ci-fast (pre-commit). golangci-lint is installed + enforced in CI; locally
      it degrades to a note if absent.

  - id: unit
    name: Unit + integration tests
    make: [test]
    description: >
      go test ./... — unit and stub-harness loop integration tests.

  - id: race
    name: Race detector
    make: [race]
    description: >
      go test -race ./... — the suite must pass cleanly under the data-race
      detector (no flaky concurrency in the loop's generate/verify phasing).

  - id: cover-regression
    name: Coverage-regression gate
    make: [cover-gate]
    description: >
      Module statement coverage (reusing the `cover` profile, -coverpkg=./...)
      must not fall below the COVER_MIN floor (currently 70%; measured ~77.9%).
      Prints measured vs floor and fails below it.

  - id: vuln
    name: Vulnerability scan
    make: [vuln]
    description: >
      govulncheck ./... — fails on known vulnerabilities in the dependency
      graph. Installed + enforced in CI; locally degrades to a note if absent.

  - id: airgap-gate
    name: Egress gate
    make: [airgap]
    gate: EGRESS=0
    hard_gate: true
    description: >
      Runs a representative command under egress capture/isolation
      (scripts/verify-airgap.sh). ANY non-loopback egress fails the build. In CI
      this runs fail-closed (AIRGAP_STRICT=1, netns isolation); GUARD-001.

  - id: trace-health
    name: Traceability / health gate
    make: [health]
    gate: TRACE=100%
    hard_gate: true
    description: >
      `rtmx health` — no orphaned requirements or tests. rtmx is the dev-loop
      foundation and this is the TRACE gate.

  - id: golden-metrics
    name: Golden-set metrics + ACR-regression gate
    make: [metrics]
    gate: ACR-regression
    hard_gate: true
    description: >
      scripts/ci-metrics.py computes ACR (north star) + TCVR/FPVR/MTC/WCR/TCR/ESC
      over eval/golden and fails if ACR regresses more than the configured delta
      below eval/baseline.json (METRIC-002).

# The three hard gates that must all hold for a green run (CLAUDE.md §5).
hard_gates:
  - EGRESS=0          # airgap-gate
  - TRACE=100%        # trace-health
  - ACR-regression    # golden-metrics
