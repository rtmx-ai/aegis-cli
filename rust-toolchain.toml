# REQ-BUILD-005: Pin the Rust toolchain for reproducible builds.
# All CI and local builds use exactly this version.
# Update by changing the channel version and running `rustup update`.
[toolchain]
channel = "1.94.0"
components = ["rustfmt", "clippy"]
targets = ["x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc", "aarch64-apple-darwin", "aarch64-unknown-linux-musl"]
