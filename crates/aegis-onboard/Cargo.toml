[package]
name = "aegis-onboard"
description = "Bounded context: aegis init state machine, credential negotiation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aegis-domain = { path = "../aegis-domain" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "io-util", "process"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tracing = { workspace = true }
sha2 = { workspace = true }
getrandom = "0.3"

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt", "net", "io-util"] }
