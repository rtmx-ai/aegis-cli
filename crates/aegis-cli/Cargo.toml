[package]
name = "aegis-cli"
description = "Composition root: wires all bounded contexts into the aegis binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
aegis-domain = { path = "../aegis-domain" }
aegis-agent = { path = "../aegis-agent" }
aegis-hitl = { path = "../aegis-hitl" }
aegis-llm = { path = "../aegis-llm" }
aegis-tui = { path = "../aegis-tui" }
aegis-audit = { path = "../aegis-audit" }
aegis-security = { path = "../aegis-security" }
aegis-infra = { path = "../aegis-infra" }
aegis-onboard = { path = "../aegis-onboard" }
async-trait = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
dirs-next = "2"
ratatui = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
aegis-test-support = { path = "../aegis-test-support" }
assert_cmd = { workspace = true }
assert_fs = { workspace = true }
cucumber = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

# REQ-TEST-020: Cucumber integration test binary.
# Runs scenarios from tests/features/ against the real aegis ports.
[[test]]
name = "cucumber"
harness = false
path = "tests/cucumber.rs"

[features]
e2e-tests = []

# REQ-BUILD-042: cargo-deb metadata for unsigned .deb generation.
# Run: cargo deb --package aegis-cli
# Output: target/debian/aegis-cli_<version>_<arch>.deb
[package.metadata.deb]
name = "aegis-cli"
maintainer = "RTMX <ops@rtmx.ai>"
copyright = "2026, RTMX Inc."
license-file = ["../../LICENSE", "0"]
extended-description = """\
Terminal-native agentic AI pair programmer for CUI environments.
Built for software engineers in the Department of War and the Defense
Industrial Base. Streaming responses, tool use, inline diffs,
human-in-the-loop approval, and immutable audit ledger -- with full
control over the compute, network, and data boundaries.
"""
section = "devel"
priority = "optional"
assets = [
    ["target/release/aegis", "usr/bin/", "755"],
    ["../../LICENSE", "usr/share/doc/aegis-cli/LICENSE", "644"],
    ["../../README.md", "usr/share/doc/aegis-cli/README.md", "644"],
]

# REQ-BUILD-043: cargo-generate-rpm metadata for unsigned .rpm generation.
# Run from workspace root:
#   cargo build --release --target x86_64-unknown-linux-musl --package aegis-cli
#   cargo-generate-rpm -p crates/aegis-cli --auto-req disabled
# Output: target/generate-rpm/aegis-cli-<version>-1.x86_64.rpm
#
# The binary is built against musl so the resulting .rpm installs on
# RHEL 9 (glibc 2.34) without runtime linker errors. Asset source paths
# are resolved relative to the package directory (crates/aegis-cli/).
[package.metadata.generate-rpm]
name = "aegis-cli"
license = "Apache-2.0"
summary = "Terminal-native agentic AI pair programmer for CUI environments"
assets = [
    { source = "../../target/x86_64-unknown-linux-musl/release/aegis", dest = "/usr/bin/aegis", mode = "755" },
    { source = "../../LICENSE", dest = "/usr/share/doc/aegis-cli/LICENSE", mode = "644", doc = true },
    { source = "../../README.md", dest = "/usr/share/doc/aegis-cli/README.md", mode = "644", doc = true },
]
