[package]
name = "aegis-cli"
description = "Composition root: wires all bounded contexts into the aegis binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
aegis-domain = { path = "../aegis-domain" }
aegis-agent = { path = "../aegis-agent" }
aegis-hitl = { path = "../aegis-hitl" }
aegis-llm = { path = "../aegis-llm" }
aegis-tui = { path = "../aegis-tui" }
aegis-audit = { path = "../aegis-audit" }
aegis-security = { path = "../aegis-security" }
aegis-infra = { path = "../aegis-infra" }
aegis-onboard = { path = "../aegis-onboard" }
async-trait = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
dirs-next = "2"
ratatui = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_fs = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[features]
e2e-tests = []
