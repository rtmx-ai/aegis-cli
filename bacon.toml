# bacon configuration for aegis-cli development
# Primary: bacon watch (auto-rebuild + restart aegis on file save)
# Also: bacon check / bacon clippy / bacon test

[default]
command = ["cargo", "check", "--workspace", "--color", "always"]
need_stdout = false
watch = ["crates", "Cargo.toml"]

[jobs.watch]
command = ["./scripts/dev-run.sh"]
need_stdout = true
allow_warnings = true
on_change_strategy = "kill_then_restart"

[jobs.check]
command = ["cargo", "check", "--workspace", "--color", "always"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--workspace", "--lib", "--color", "always"]
need_stdout = true

[jobs.run]
command = ["cargo", "run", "--", "chat", "--headless", "-p", "hello"]
need_stdout = true
allow_warnings = true

[jobs.doc]
command = ["cargo", "doc", "--workspace", "--no-deps", "--color", "always"]
need_stdout = false

[keybindings]
w = "job:watch"
c = "job:check"
l = "job:clippy"
t = "job:test"
r = "job:run"
