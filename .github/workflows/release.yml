# GitHub Actions release for aegis-cli.
#
# Tag-triggered (BUILD-007). Like ci.yml, the Makefile is the single source of
# truth: this workflow sets up the toolchain and runs `make release`, which
# produces the reproducible static binaries, the CycloneDX SBOM, the SHA-256
# checksums manifest, and the offline detached signature (scripts/release.sh).
#
# Signing is air-gap-first (offline detached minisign/GPG), NOT keyless cosign —
# a closed enclave cannot reach an online CA/transparency log. The signing key
# is provided via the MINISIGN_KEY / GPG_KEY secret.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # REL-009/010: build the per-platform Homebrew bundle tarballs by CALLING the reusable
  # bundle-matrix workflow (one definition, also runnable standalone via workflow_dispatch). Its
  # matrix fail-fast:false + the release job's if:!cancelled() mean a platform that fails to build
  # degrades gracefully — fill-formula prunes it — rather than sinking the whole release.
  bundle:
    uses: ./.github/workflows/bundle-matrix.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: bundle
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.25.11
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3"

      # OC-007: install Bun via `run:` (the org allowlists Actions, so third-party
      # setup actions like oven-sh/setup-bun are blocked) so `make release` ->
      # scripts/build-opencode.sh builds + bundles the self-built OpenCode. cmake/cc
      # are preinstalled on ubuntu-latest, so scripts/build-llama.sh also runs
      # (BUILD-011 — the release tier builds the full stack). This is the heavy
      # full-stack tier; the per-push gate (make ci) stays Go-only.
      - name: Install Bun (for the OpenCode build)
        run: |
          # Pin bun: CI installs latest by default, which re-resolves opencode v1.17.9's
          # lockfile and breaks build-opencode.sh's --frozen-lockfile (OC-003). 1.3.14 is the
          # version whose resolution matches the committed lockfile.
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # REL-010: pull the per-platform bundle tarballs the matrix built into ./bundles;
      # release.sh ingests them into dist/ (it wipes dist/ at the top, so they cannot be
      # pre-staged there) so they are signed + published + pinned into the formula.
      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: bundle-*
          merge-multiple: true

      # minisign is NOT preinstalled on ubuntu-latest; without it release.sh skips signing and
      # SHA256SUMS ships UNSIGNED (the cause of the first v1.0.0). Install it before make release.
      - name: Install minisign (offline detached signing)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign

      # Single build step — the same `make release` an operator runs locally. The build is
      # offline (GOPROXY=off, -mod=vendor); only checkout + setup + the bundle download touch
      # the network. release.sh ingests ./bundles (BUNDLES_DIR) into the signed artifact set.
      - name: make release (binaries + SBOM + checksums + signature)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          GPG_KEY: ${{ secrets.GPG_KEY }}
        run: make release

      # Publish via the pre-installed gh CLI rather than a third-party action:
      # the org allowlists Actions (allowed_actions=selected), so softprops/* is
      # blocked and caused a startup failure. gh needs no allowlist entry.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          assets="$(ls dist/aegis-* dist/aegis_*.deb dist/sbom.cdx.json dist/SHA256SUMS 2>/dev/null)"
          for s in dist/SHA256SUMS.minisig dist/SHA256SUMS.asc; do
            [ -f "$s" ] && assets="$assets $s"
          done
          notes="Automated release. Static binaries + bundles (linux amd64/arm64, macOS Apple Silicon arm64), Debian .deb packages, CycloneDX SBOM, and SHA-256 checksums with a minisign signature. Verify downloads against SHA256SUMS."
          # REL-015: idempotent publish — a re-run/retry (e.g. after a transient bundle-build flake) must
          # UPDATE the existing release, not fail with "release already exists" (which strands the newly
          # built assets and skips the tap publish, exactly what stranded v1.9.0's darwin bottle).
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $assets --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" $assets --title "$GITHUB_REF_NAME" --notes "$notes"
          fi

      # REL-007/010: pin + publish the Homebrew tap formula to github.com/rtmx-ai/homebrew-tap.
      # dist/ now holds every platform's bundle tarball (the matrix artifacts ingested above), so
      # fill-formula pins all of them by sha256 (pruning any that failed to build). It writes
      # ONLY Formula/aegis.rb — never the shared tap's README or rtmx.rb.
      - name: Publish Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          [ -n "${TAP_TOKEN:-}" ] || { echo "REL-007: no HOMEBREW_TAP_TOKEN secret — skipping tap publish"; exit 0; }
          v="${GITHUB_REF_NAME#v}"
          scripts/fill-formula.sh "$v" dist deploy/homebrew/aegis.rb /tmp/aegis.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/rtmx-ai/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula && cp /tmp/aegis.rb /tmp/tap/Formula/aegis.rb
          cd /tmp/tap
          git config user.name "aegis-release-bot"; git config user.email "dev@rtmx.ai"
          git add Formula/aegis.rb
          git commit -m "aegis ${GITHUB_REF_NAME}" && git push || echo "REL-007: tap formula unchanged"

      # REL-007: generate the apt repository (indices + signed Release) from the .deb packages.
      # NOTE: the harness-bundled .deb is ~190MB (> GitHub Pages' 100MB/file limit), so the .deb
      # ships as a RELEASE asset (above) and Pages can host the apt METADATA but not the big
      # package. The bundled apt channel needs a non-Pages object store, OR a binary-only .deb
      # variant on Pages with the harness side-loaded — see docs/requirements/packaging.md. This
      # builds the repo so it is ready once that is decided (not deployed to Pages here).
      - name: Build apt repository
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
        run: |
          set -eu
          command -v dpkg-scanpackages >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev; }
          scripts/build-apt-repo.sh dist dist/apt || echo "REL-007: apt repo generation skipped"
