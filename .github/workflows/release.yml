# @req REQ-BUILD-040 GPG signing of Linux release artifacts
# @req REQ-BUILD-041 Authenticode signing of Windows release artifacts
#
# Tag-triggered release workflow: build, sign, and publish artifacts.
#
# Required GitHub Actions secrets (provision in repo Settings > Secrets):
#   GPG_PRIVATE_KEY  - ASCII-armored GPG private key for release signing
#   GPG_PASSPHRASE   - Passphrase for the GPG key
#
# Windows Authenticode: uses a self-signed certificate generated in CI.
# Replace with a CA-issued cert when REQ-BUILD-055 is implemented.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build + sign but skip release creation)'
        required: true
        default: 'true'
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # REQ-BUILD-005: Reproducible builds -- fixed timestamp.
  SOURCE_DATE_EPOCH: "1774656000"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build Linux musl static binary, generate .deb, .rpm, and SBOM
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - name: Install packaging tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked
          cargo install cargo-cyclonedx --locked
      - name: Build release binary (musl static)
        run: |
          cargo build --release --package aegis-cli --target x86_64-unknown-linux-musl
      - name: Build release binary (glibc, for deb)
        run: cargo build --release --package aegis-cli
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --spec-version 1.5
      - name: Generate .deb package
        run: cargo deb --package aegis-cli --no-build
      - name: Generate .rpm package
        run: cargo-generate-rpm -p crates/aegis-cli --auto-req disabled
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          GIT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GIT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
      - name: Create release tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL_NAME="aegis-${VERSION}-linux-x86_64"
          STAGING="target/release-staging/${TARBALL_NAME}"
          mkdir -p "$STAGING"
          cp target/x86_64-unknown-linux-musl/release/aegis "$STAGING/aegis"
          cp crates/aegis-cli/aegis-cli.cdx.json "$STAGING/sbom.json"
          cp LICENSE "$STAGING/LICENSE"
          cp README.md "$STAGING/README.md"
          cd target/release-staging
          tar czf "${TARBALL_NAME}.tar.gz" "${TARBALL_NAME}"
          echo "Created: ${TARBALL_NAME}.tar.gz"
      - name: Create airgap bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          GIT_SHA="${{ steps.version.outputs.git_sha }}"
          BUILD_DATE="${{ steps.version.outputs.build_date }}"
          BUNDLE_NAME="aegis-${VERSION}-airgap-linux-x86_64"
          STAGING="target/airgap/${BUNDLE_NAME}"

          mkdir -p "$STAGING"
          cp target/x86_64-unknown-linux-musl/release/aegis "$STAGING/aegis"
          cp crates/aegis-cli/aegis-cli.cdx.json "$STAGING/sbom.json"
          cp LICENSE "$STAGING/LICENSE"
          cp README.md "$STAGING/README.md"

          # plugins/ directory for closed-network deployments.
          mkdir -p "$STAGING/plugins"
          cat > "$STAGING/plugins/PLUGINS.md" <<'PLUGINEOF'
          # Bundled Plugins
          #
          # Place plugin binaries in this directory before installation.
          # aegis discovers plugins on PATH or in ~/.aegis/plugins/.
          #
          # Required plugins by mode:
          #   gcp-assured-workloads  -- GCP Assured Workloads IL4/IL5
          PLUGINEOF

          cat > "$STAGING/version.json" <<JSON
          {
            "version": "${VERSION}",
            "git_sha": "${GIT_SHA}",
            "build_date": "${BUILD_DATE}",
            "target": "x86_64-unknown-linux-musl"
          }
          JSON

          cd "$STAGING"
          sha256sum aegis sbom.json LICENSE README.md version.json plugins/PLUGINS.md > manifest.txt
          cat manifest.txt

          cd ..
          tar czf "${BUNDLE_NAME}.tar.gz" "${BUNDLE_NAME}"
          sha256sum "${BUNDLE_NAME}.tar.gz" > "${BUNDLE_NAME}.tar.gz.sha256"
          echo "Created: ${BUNDLE_NAME}.tar.gz"
      - name: Collect artifacts for signing
        run: |
          mkdir -p target/release-artifacts
          VERSION="${{ steps.version.outputs.version }}"
          # Binary
          cp target/x86_64-unknown-linux-musl/release/aegis target/release-artifacts/aegis
          # SBOM
          cp crates/aegis-cli/aegis-cli.cdx.json target/release-artifacts/aegis-cli.cdx.json
          # Deb
          cp target/debian/aegis-cli_*.deb target/release-artifacts/
          # RPM
          cp target/generate-rpm/aegis-cli-*.rpm target/release-artifacts/
          # Release tarball
          cp target/release-staging/aegis-*-linux-x86_64.tar.gz target/release-artifacts/
          # Airgap bundle + sha256
          cp target/airgap/aegis-*-airgap-linux-x86_64.tar.gz target/release-artifacts/
          cp target/airgap/aegis-*-airgap-linux-x86_64.tar.gz.sha256 target/release-artifacts/
          echo "--- Artifacts to sign ---"
          ls -la target/release-artifacts/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: target/release-artifacts/*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 1a: Build Linux aarch64 musl static binary (REQ-BUILD-071)
  # ---------------------------------------------------------------------------
  build-linux-aarch64:
    name: Build Linux aarch64 Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # REQ-BUILD-070: Install aarch64 cross-compilation toolchain
      # Uses gcc-aarch64-linux-gnu with FORTIFY_SOURCE disabled to avoid
      # glibc symbols (__memcpy_chk etc.) leaking into musl builds.
      # Matches CI workflow approach (proven reliable).
      - name: Install aarch64 cross tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
      - name: Build release binary (aarch64 musl static)
        env:
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
          CFLAGS_aarch64_unknown_linux_musl: "-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"
        run: |
          cargo build --release --package aegis-cli --target aarch64-unknown-linux-musl
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # REQ-BUILD-072: Smoke test aarch64 binary via qemu-user-static
      - name: Smoke test aarch64 binary (qemu)
        run: |
          sudo apt-get install -y qemu-user-static
          qemu-aarch64-static ./target/aarch64-unknown-linux-musl/release/aegis --help
          echo "PASS: aarch64 binary runs under qemu-user-static"
      # REQ-BUILD-073: Create release tarball for aarch64
      - name: Create release tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL_NAME="aegis-${VERSION}-linux-aarch64"
          STAGING="target/release-staging/${TARBALL_NAME}"
          mkdir -p "$STAGING"
          cp target/aarch64-unknown-linux-musl/release/aegis "$STAGING/aegis"
          cp LICENSE "$STAGING/LICENSE"
          cp README.md "$STAGING/README.md"
          cd target/release-staging
          tar czf "${TARBALL_NAME}.tar.gz" "${TARBALL_NAME}"
          echo "Created: ${TARBALL_NAME}.tar.gz"
      - name: Collect artifacts for signing
        run: |
          mkdir -p target/release-artifacts
          VERSION="${{ steps.version.outputs.version }}"
          # Binary
          cp target/aarch64-unknown-linux-musl/release/aegis target/release-artifacts/aegis-linux-aarch64
          # Release tarball
          cp target/release-staging/aegis-*-linux-aarch64.tar.gz target/release-artifacts/
          echo "--- aarch64 artifacts ---"
          ls -la target/release-artifacts/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-linux-aarch64
          path: target/release-artifacts/*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 1b: Build macOS binaries (Apple Silicon + Intel)
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS Artifacts
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Ensure cross-compilation targets are installed
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup target list --installed
      - name: Build release binaries
        run: |
          cargo build --release --package aegis-cli --target aarch64-apple-darwin
          cargo build --release --package aegis-cli --target x86_64-apple-darwin
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create release tarballs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for arch in aarch64 x86_64; do
            TARBALL_NAME="aegis-${VERSION}-macos-${arch}"
            STAGING="target/release-staging/${TARBALL_NAME}"
            mkdir -p "$STAGING"
            cp "target/${arch}-apple-darwin/release/aegis" "$STAGING/aegis"
            cp LICENSE "$STAGING/LICENSE"
            cp README.md "$STAGING/README.md"
            cd target/release-staging
            tar czf "${TARBALL_NAME}.tar.gz" "${TARBALL_NAME}"
            echo "Created: ${TARBALL_NAME}.tar.gz"
            cd ../..
          done
      - name: Collect artifacts
        run: |
          mkdir -p target/release-artifacts
          VERSION="${{ steps.version.outputs.version }}"
          cp target/aarch64-apple-darwin/release/aegis target/release-artifacts/aegis-macos-aarch64
          cp target/x86_64-apple-darwin/release/aegis target/release-artifacts/aegis-macos-x86_64
          cp target/release-staging/aegis-*-macos-*.tar.gz target/release-artifacts/
          ls -la target/release-artifacts/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-macos
          path: target/release-artifacts/*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 1c: Build Windows MSVC binary + Authenticode sign (REQ-BUILD-041)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows Artifacts
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary (MSVC)
        run: cargo build --release --package aegis-cli --target x86_64-pc-windows-msvc
      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install cargo-wix
        run: cargo install cargo-wix --locked
      - name: Generate MSI installer
        shell: bash
        run: |
          # cargo-wix expects to run from the workspace root
          cargo wix --package aegis-cli --nocapture \
            --target x86_64-pc-windows-msvc \
            --no-build
          echo "--- Generated MSI ---"
          ls -la target/wix/*.msi
      - name: Smoke test MSI silent install
        shell: pwsh
        run: |
          # REQ-BUILD-048: silent install smoke test
          $msi = Get-ChildItem -Path target\wix\*.msi | Select-Object -First 1
          Write-Host "Installing: $($msi.FullName)"
          Start-Process msiexec -ArgumentList "/i", "`"$($msi.FullName)`"", "/qn" -Wait -NoNewWindow
          # Verify aegis is on PATH and runs
          $env:PATH = "C:\Program Files\aegis;$env:PATH"
          $version = & aegis --version 2>&1
          Write-Host "aegis --version: $version"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "aegis --version failed with exit code $LASTEXITCODE"
            exit 1
          }
          Write-Host "MSI smoke test passed"
      - name: Create self-signed certificate and sign binary
        shell: pwsh
        run: |
          # Generate a self-signed Authenticode certificate
          # REQ-BUILD-055: replace with CA-issued cert when available
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=RTMX AI (Development), O=RTMX AI" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(1)

          # Sign the binary and MSI
          $filesToSign = @(
            "target\x86_64-pc-windows-msvc\release\aegis.exe"
          )
          # Add MSI if it exists
          $msi = Get-ChildItem -Path target\wix\*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { $filesToSign += $msi.FullName }

          foreach ($file in $filesToSign) {
            Write-Host "Signing: $file"
            Set-AuthenticodeSignature `
              -FilePath $file `
              -Certificate $cert `
              -TimestampServer "http://timestamp.digicert.com" `
              -HashAlgorithm SHA256

            $sig = Get-AuthenticodeSignature -FilePath $file
            Write-Host "  Status: $($sig.Status) | Signer: $($sig.SignerCertificate.Subject)"

            # Self-signed certs report UnknownError (untrusted root).
            # Accept both Valid and UnknownError; reject only unsigned/broken.
            if ($sig.Status -notin @("Valid", "UnknownError")) {
              Write-Error "Authenticode signature failed for $file (status: $($sig.Status))"
              exit 1
            }
          }
          Write-Host "All files signed successfully (self-signed cert)"
      - name: Create release tarball
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIRNAME="aegis-${VERSION}-windows-x86_64"
          mkdir -p "target/release-staging/${DIRNAME}"
          cp target/x86_64-pc-windows-msvc/release/aegis.exe "target/release-staging/${DIRNAME}/aegis.exe"
          cp LICENSE "target/release-staging/${DIRNAME}/LICENSE"
          cp README.md "target/release-staging/${DIRNAME}/README.md"
          cd target/release-staging
          7z a -tzip "${DIRNAME}.zip" "${DIRNAME}"
          echo "Created: ${DIRNAME}.zip"
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p target/release-artifacts
          cp target/x86_64-pc-windows-msvc/release/aegis.exe target/release-artifacts/aegis-windows-x86_64.exe
          cp target/release-staging/aegis-*-windows-x86_64.zip target/release-artifacts/
          # Include MSI if generated
          cp target/wix/*.msi target/release-artifacts/ 2>/dev/null || true
          ls -la target/release-artifacts/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-windows
          path: target/release-artifacts/*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: Import GPG key, sign all artifacts, verify signatures
  # ---------------------------------------------------------------------------
  sign:
    name: Sign Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-linux, build-linux-aarch64, build-macos, build-windows]
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - name: Download Linux build artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts
      # REQ-BUILD-073: Include aarch64 Linux artifacts in signing
      - name: Download Linux aarch64 build artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts-linux-aarch64
          path: artifacts
      - name: Download macOS build artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts-macos
          path: artifacts
      - name: Download Windows build artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts-windows
          path: artifacts
      - name: Import GPG key
        if: env.HAS_GPG_KEY == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Trust the imported key ultimately
          KEYID=$(gpg --list-secret-keys --keyid-format long | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "${KEYID}:6:" | gpg --import-ownertrust
          echo "Imported GPG key: $KEYID"
      - name: Sign all artifacts
        if: env.HAS_GPG_KEY == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd artifacts
          for file in *; do
            # Skip .sha256 files and any existing .asc files
            case "$file" in
              *.asc|*.sha256) continue ;;
            esac
            echo "Signing: $file"
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor "$file"
          done
          echo "--- Signed artifacts ---"
          ls -la *.asc
      - name: Verify all signatures
        if: env.HAS_GPG_KEY == 'true'
        run: |
          cd artifacts
          FAIL=0
          for sig in *.asc; do
            FILE="${sig%.asc}"
            echo "Verifying: $sig -> $FILE"
            if ! gpg --verify "$sig" "$FILE"; then
              echo "FAILED: $sig"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "One or more signature verifications failed"
            exit 1
          fi
          echo "All signatures verified"
      - name: Warn if unsigned
        if: env.HAS_GPG_KEY != 'true'
        run: |
          echo "::warning::GPG_PRIVATE_KEY secret not configured. Artifacts will not be GPG-signed."
          echo "::warning::Set GPG_PRIVATE_KEY and GPG_PASSPHRASE secrets to enable signing."
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: signed-artifacts
          path: artifacts/*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3: Create GitHub Release with all files
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [sign]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download signed artifacts
        uses: actions/download-artifact@v8
        with:
          name: signed-artifacts
          path: artifacts
      - name: Extract version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          gh release create "$TAG" \
            --title "aegis $VERSION" \
            --generate-notes \
            artifacts/*

  # ---------------------------------------------------------------------------
  # Job 5: Build and push container image to GHCR
  # REQ-BUILD-075: Tagged release pushes container image
  # ---------------------------------------------------------------------------
  container:
    name: Container Image
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Extract version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build container image
        run: docker build -t ghcr.io/rtmx-ai/aegis:${{ steps.tag.outputs.version }} -t ghcr.io/rtmx-ai/aegis:latest .
      - name: Smoke test container
        run: docker run --rm ghcr.io/rtmx-ai/aegis:${{ steps.tag.outputs.version }} --version
      - name: Push container image
        run: |
          docker push ghcr.io/rtmx-ai/aegis:${{ steps.tag.outputs.version }}
          docker push ghcr.io/rtmx-ai/aegis:latest
