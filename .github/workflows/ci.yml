name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# INCIDENT MITIGATION (2026-03-28):
# GitHub's automated abuse detection flagged the rhino11 account after this
# workflow's release builds (LTO + codegen-units=1, musl + MSVC in parallel)
# resembled cryptocurrency mining. Mitigations applied:
# - Concurrency control prevents stacking builds (REQ-HDN-001)
# - Explicit timeout-minutes on every job (REQ-HDN-002)
# - Release builds gated to main branch only (REQ-HDN-003)
# - Cross-compilation serialized with max-parallel: 1 (REQ-HDN-004)
# - CI cargo profile uses thin LTO (REQ-HDN-005)
# Do not remove these constraints without reviewing rtmx-ai/ops.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# REQ-TEST-005: Required status checks for branch protection
# The following jobs MUST be listed as required status checks in GitHub
# branch protection rules for the `main` branch:
#   - Format
#   - Lint
#   - Unit Tests (ubuntu-latest)
#   - Unit Tests (windows-latest)
#   - Integration Tests
#   - Integration Tests (windows)
#   - Doc Tests
#   - Coverage
#   - License & Advisory Audit
#   - RTMX Requirements Health
#   - Build Gate
#
# NOTE: Build and Cross-compile jobs are gated to main-only pushes
# (REQ-HDN-003). The "Build Gate" job satisfies branch protection on PRs
# by passing through when builds are skipped.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  PROPTEST_SEED: "12345"
  # REQ-BUILD-005: Reproducible builds -- fixed timestamp eliminates
  # date-based variation in binaries. Set to project epoch (2026-03-25).
  SOURCE_DATE_EPOCH: "1774656000"
  # rtmx:req REQ-BUILD-013 -- sccache compilation caching for sub-5-min incremental CI
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --all

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # rtmx:req REQ-BUILD-013 -- sccache compilation caching
      - uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # rtmx:req REQ-BUILD-013 -- sccache compilation caching
      - uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --lib --workspace

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # rtmx:req REQ-BUILD-013 -- sccache compilation caching
      - uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Run integration tests (skip if none exist)
        run: |
          if cargo nextest list --test '*' --workspace 2>/dev/null | grep -q "test:"; then
            cargo nextest run --test '*' --workspace
          else
            echo "No integration test binaries found -- skipping"
          fi

  # rtmx:req REQ-TEST-043 -- Integration tests run on both ubuntu and windows
  integration-tests-windows:
    name: Integration Tests (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # rtmx:req REQ-BUILD-013 -- sccache compilation caching
      - uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Run integration tests (exclude Unix-only MCP tests)
        # MCP integration tests require bash/shell scripts and are Unix-only.
        # Use -E filter to exclude mcp_integration tests on Windows.
        shell: bash
        run: |
          if cargo nextest list --test '*' --workspace 2>&1 | grep -q "test:"; then
            cargo nextest run --test '*' --workspace -E 'not test(mcp_)'
          else
            echo "No integration test binaries found -- skipping"
          fi

  doc-tests:
    name: Doc Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # rtmx:req REQ-BUILD-013 -- sccache compilation caching
      - uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --doc --workspace

  coverage:
    name: Coverage
    # rtmx:req REQ-TEST-034 -- Coverage threshold: fail < 60%, warn < 70%, target 80%
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # REQ-BUILD-013: Disable sccache for coverage -- instrumented builds
    # must not share cache with non-instrumented builds.
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --lib --workspace
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --json --output-path coverage.json
      - name: Check thresholds
        # REQ-TEST-004: Coverage threshold enforcement.
        # REQ-TEST-034: Coverage threshold gate -- CI fails if coverage
        # drops below COVERAGE_FAIL_THRESHOLD. Adjust the env var below
        # as the project matures toward the 80% target.
        env:
          COVERAGE_FAIL_THRESHOLD: "60"
          COVERAGE_WARN_THRESHOLD: "70"
          COVERAGE_TARGET: "80"
        run: |
          LINE_COV=$(python3 -c "
          import json, sys
          with open('coverage.json') as f:
              data = json.load(f)
          totals = data.get('data', [{}])[0].get('totals', {})
          lines = totals.get('lines', {})
          pct = lines.get('percent', 0.0)
          print(f'{pct:.2f}')
          ")
          echo "Line coverage: ${LINE_COV}%"
          echo "Thresholds: fail < ${COVERAGE_FAIL_THRESHOLD}%, warn < ${COVERAGE_WARN_THRESHOLD}%, target ${COVERAGE_TARGET}%"
          # rtmx:req REQ-TEST-034 -- gate: fail the job when coverage is below threshold
          if python3 -c "exit(0 if float('${LINE_COV}') < float('${COVERAGE_FAIL_THRESHOLD}') else 1)"; then
            echo "FAIL: Coverage ${LINE_COV}% is below threshold ${COVERAGE_FAIL_THRESHOLD}%"
            exit 1
          fi
          if python3 -c "exit(0 if float('${LINE_COV}') < float('${COVERAGE_WARN_THRESHOLD}') else 1)"; then
            echo "WARN: Coverage ${LINE_COV}% is below warning threshold ${COVERAGE_WARN_THRESHOLD}%"
          else
            echo "OK: Coverage ${LINE_COV}% meets current threshold"
          fi
      - uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false

  cargo-deny:
    name: License & Advisory Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories

  # REQ-BUILD-039: CycloneDX SBOM generation
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # rtmx:req REQ-BUILD-013 -- sccache compilation caching
      - uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate CycloneDX SBOMs (per crate)
        run: cargo cyclonedx --format json --spec-version 1.5
      - name: Verify aegis-cli SBOM exists
        run: |
          SBOM=crates/aegis-cli/aegis-cli.cdx.json
          test -f "$SBOM" || { echo "Missing $SBOM"; exit 1; }
          COMPONENTS=$(jq '.components | length' "$SBOM")
          FORMAT=$(jq -r '.bomFormat' "$SBOM")
          SPEC=$(jq -r '.specVersion' "$SBOM")
          echo "SBOM: $SBOM"
          echo "Format: $FORMAT $SPEC"
          echo "Components: $COMPONENTS"
          [ "$FORMAT" = "CycloneDX" ] || exit 1
          [ "$SPEC" = "1.5" ] || exit 1
          [ "$COMPONENTS" -gt 0 ] || exit 1
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: aegis-cli-sbom
          path: crates/*/aegis-*.cdx.json
          retention-days: 90

  # REQ-BUILD-042: cargo-deb unsigned package generation
  # REQ-BUILD-045: deb install smoke test on Ubuntu CI
  deb-package:
    name: Debian Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # rtmx:req REQ-BUILD-013 -- sccache compilation caching
      - uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build release binary
        run: cargo build --release --package aegis-cli
      - name: Generate .deb package
        run: cargo deb --package aegis-cli --no-build
      - name: Verify .deb exists and is valid
        run: |
          DEB=$(ls target/debian/aegis-cli_*.deb)
          test -f "$DEB" || { echo "Missing .deb"; exit 1; }
          echo "Generated: $DEB ($(stat -c%s "$DEB") bytes)"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" | head -20
      - name: Install .deb and run aegis (REQ-BUILD-045 smoke test)
        run: |
          DEB=$(ls target/debian/aegis-cli_*.deb)
          sudo dpkg -i "$DEB"
          which aegis
          aegis --version
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: aegis-cli-deb
          path: target/debian/aegis-cli_*.deb
          retention-days: 90

  # REQ-BUILD-043: cargo-generate-rpm unsigned package generation
  # REQ-BUILD-046: rpm install smoke test on RHEL CI
  # Builds against musl so the binary is statically linked -- RHEL 9 has
  # glibc 2.34 which cannot run binaries built against newer glibc.
  rpm-package:
    name: RPM Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # rtmx:req REQ-BUILD-013 -- sccache compilation caching
      - uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Build release binary (musl static)
        run: cargo build --release --package aegis-cli --target x86_64-unknown-linux-musl
      - name: Generate .rpm package
        # Run from workspace root with -p <path>. --auto-req disabled avoids
        # cargo-generate-rpm trying to parse the binary for dependencies
        # (which can fail silently on ELF binaries without libc symbols).
        run: |
          set -x
          cargo-generate-rpm -p crates/aegis-cli --auto-req disabled 2>&1
          echo "--- workspace target dir contents ---"
          ls -la target/ || true
          ls -la target/generate-rpm/ || { echo "No target/generate-rpm/"; exit 1; }
      - name: Verify .rpm exists and is valid
        run: |
          sudo apt-get install -y rpm
          RPM=$(ls target/generate-rpm/aegis-cli-*.rpm 2>/dev/null | head -1)
          test -n "$RPM" || { echo "No .rpm found in target/generate-rpm/"; ls -la target/generate-rpm/ || true; exit 1; }
          echo "Generated: $RPM ($(stat -c%s "$RPM") bytes)"
          rpm -qip "$RPM"
          rpm -qlp "$RPM"
      - name: Install .rpm in RHEL 9 container (REQ-BUILD-046 smoke test)
        run: |
          RPM=$(ls target/generate-rpm/aegis-cli-*.rpm | head -1)
          BASENAME=$(basename "$RPM")
          docker run --rm -v "$PWD/target/generate-rpm:/rpms:ro" \
            redhat/ubi9:latest \
            sh -c "rpm -i /rpms/$BASENAME && /usr/bin/aegis --version"
      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v7
        with:
          name: aegis-cli-rpm
          path: target/generate-rpm/aegis-cli-*.rpm
          retention-days: 90

  # REQ-BUILD-049: Airgap update bundle with manifest and version file
  airgap-bundle:
    name: Airgap Update Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [sbom, rpm-package]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # rtmx:req REQ-BUILD-013 -- sccache compilation caching
      - uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Build musl static binary
        run: cargo build --release --package aegis-cli --target x86_64-unknown-linux-musl
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --spec-version 1.5
      - name: Build airgap bundle
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          GIT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUNDLE_NAME="aegis-${VERSION}-airgap-linux-x86_64"
          STAGING="$PWD/target/airgap/${BUNDLE_NAME}"

          mkdir -p "$STAGING"
          cp target/x86_64-unknown-linux-musl/release/aegis "$STAGING/aegis"
          cp crates/aegis-cli/aegis-cli.cdx.json "$STAGING/sbom.json"
          cp LICENSE "$STAGING/LICENSE"
          cp README.md "$STAGING/README.md"

          # plugins/ directory for closed-network deployments.
          # Plugin binaries are fetched from their GitHub releases and
          # bundled so airgap environments have everything needed.
          # When no pre-built plugin binaries are available (CI-only),
          # include the directory with a manifest of expected plugins.
          mkdir -p "$STAGING/plugins"
          cat > "$STAGING/plugins/PLUGINS.md" <<'PLUGINEOF'
          # Bundled Plugins
          #
          # Place plugin binaries in this directory before installation.
          # aegis discovers plugins on PATH or in ~/.aegis/plugins/.
          #
          # Required plugins by mode:
          #   gcp-assured-workloads  -- GCP Assured Workloads IL4/IL5
          PLUGINEOF

          # version.json
          cat > "$STAGING/version.json" <<JSON
          {
            "version": "${VERSION}",
            "git_sha": "${GIT_SHA}",
            "build_date": "${BUILD_DATE}",
            "target": "x86_64-unknown-linux-musl"
          }
          JSON

          # manifest.txt: SHA-256 of every file in the bundle
          cd "$STAGING"
          sha256sum aegis sbom.json LICENSE README.md version.json plugins/PLUGINS.md > manifest.txt
          cat manifest.txt

          # Tarball
          cd ..
          tar czf "${BUNDLE_NAME}.tar.gz" "${BUNDLE_NAME}"
          echo "Bundle: target/airgap/${BUNDLE_NAME}.tar.gz ($(stat -c%s ${BUNDLE_NAME}.tar.gz) bytes)"
          tar tzf "${BUNDLE_NAME}.tar.gz" | head -20
      - name: Verify bundle structure
        run: |
          BUNDLE=$(ls target/airgap/aegis-*-airgap-linux-x86_64.tar.gz | head -1)
          test -f "$BUNDLE" || { echo "Missing bundle"; exit 1; }
          # Extract and verify contents
          EXTRACT=$(mktemp -d)
          tar xzf "$BUNDLE" -C "$EXTRACT"
          DIR=$(ls "$EXTRACT")
          cd "$EXTRACT/$DIR"
          test -f aegis || { echo "Missing binary"; exit 1; }
          test -f sbom.json || { echo "Missing sbom.json"; exit 1; }
          test -f manifest.txt || { echo "Missing manifest.txt"; exit 1; }
          test -f version.json || { echo "Missing version.json"; exit 1; }
          test -f LICENSE || { echo "Missing LICENSE"; exit 1; }
          test -d plugins || { echo "Missing plugins/ directory"; exit 1; }
          test -f plugins/PLUGINS.md || { echo "Missing plugins/PLUGINS.md"; exit 1; }
          # Verify manifest checksums
          sha256sum -c manifest.txt
          # Verify the binary runs
          ./aegis --version
          # Verify version.json is valid JSON
          cat version.json | python3 -c 'import json, sys; json.load(sys.stdin)'
          echo "Airgap bundle verified"
      - name: Upload airgap bundle
        uses: actions/upload-artifact@v7
        with:
          name: aegis-cli-airgap-bundle
          path: target/airgap/*.tar.gz
          retention-days: 90

  rtmx-health:
    name: RTMX Requirements Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install rtmx
      - run: rtmx status

  # rtmx:req REQ-TEST-033 -- Coverage delta in PR comments
  coverage-delta:
    name: RTMX Coverage Delta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [rtmx-health]
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Post coverage delta comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          export PR_NUMBER
          bash scripts/coverage-delta.sh --post-comment \
            "origin/${{ github.event.pull_request.base.ref }}" \
            "${{ github.event.pull_request.head.sha }}"

  # REQ-TEST-039: Scan // rtmx:req markers and verify requirements traceability.
  # Uses native rtmx CLI (v0.2.5+) which scans Rust // rtmx:req markers.
  rtmx-update:
    name: RTMX Requirements Update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install rtmx
        run: pip install rtmx
      - name: Scan test markers
        run: rtmx from-tests crates/ --update
      - name: Report marker coverage
        run: rtmx from-tests crates/ --show-all | tail -5

  build-gate:
    name: Build Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [format, lint, unit-tests, integration-tests, integration-tests-windows, doc-tests, coverage, cargo-deny, sbom, deb-package, rpm-package, airgap-bundle, rtmx-health, rtmx-update]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"

  binary-build:
    name: Build (${{ matrix.target }})
    # REQ-HDN-003: Release builds only on main (not PRs).
    # These LTO builds are extremely CPU-intensive and triggered GitHub's
    # abuse detection on 2026-03-28. PR builds validate correctness only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [format, lint, unit-tests, integration-tests, integration-tests-windows, doc-tests]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # REQ-HDN-004: Serialize cross-compilation to reduce peak CPU.
      max-parallel: 1
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # REQ-BUILD-070: aarch64 Linux musl cross-compilation target
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # rtmx:req REQ-BUILD-013 -- sccache compilation caching
      - uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      # REQ-BUILD-070: Install aarch64 cross-compilation toolchain
      - name: Install aarch64 cross tools
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
      # REQ-HDN-005: Use CI profile (thin LTO) instead of full release.
      - name: Build binary
        run: cargo build --profile ci --target ${{ matrix.target }}
      # REQ-BUILD-072: Smoke test aarch64 binary via qemu-user-static
      - name: Smoke test aarch64 binary (qemu)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get install -y qemu-user-static
          qemu-aarch64-static ./target/aarch64-unknown-linux-musl/ci/aegis --help
          echo "PASS: aarch64 binary runs under qemu-user-static"
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: aegis-${{ matrix.target }}
          retention-days: 7
          path: |
            target/${{ matrix.target }}/ci/aegis
            target/${{ matrix.target }}/ci/aegis.exe

  # REQ-BUILD-026: macOS aarch64 (Apple Silicon) release binary
  build-macos:
    name: Build (aarch64-apple-darwin)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [format, lint, unit-tests, integration-tests, integration-tests-windows, doc-tests]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      # rtmx:req REQ-BUILD-013 -- sccache compilation caching
      - uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile ci --target aarch64-apple-darwin --package aegis-cli
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: aegis-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/ci/aegis
          retention-days: 90

  cross-compile-verify:
    name: Cross-compile Verification (${{ matrix.target }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: binary-build
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # REQ-BUILD-070: Verify aarch64 musl binary is statically linked
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download musl binary
        uses: actions/download-artifact@v8
        with:
          name: aegis-${{ matrix.target }}
      - name: Verify musl binary is statically linked
        run: |
          chmod +x aegis
          echo "--- file output ---"
          file aegis
          file aegis | grep -qE "statically linked|static-pie linked"
          echo "PASS: musl binary is statically linked"
          echo "--- ldd output (expect 'not a dynamic executable') ---"
          ldd aegis 2>&1 || true
