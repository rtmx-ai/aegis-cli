name: CI

on:
  push:
    branches: [main]
  pull_request:

# REQ-TEST-005: Required status checks for branch protection
# The following jobs MUST be listed as required status checks in GitHub
# branch protection rules for the `main` branch:
#   - Format
#   - Lint
#   - Unit Tests (ubuntu-latest)
#   - Unit Tests (windows-latest)
#   - Integration Tests
#   - Doc Tests
#   - Coverage
#   - License & Advisory Audit
#   - RTMX Requirements Health
#   - Build (x86_64-unknown-linux-musl)
#   - Build (x86_64-pc-windows-msvc)
#   - Cross-compile Verification (x86_64-unknown-linux-musl)

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --all

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --lib --workspace

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Run integration tests (skip if none exist)
        run: |
          if cargo nextest list --test '*' --workspace 2>/dev/null | grep -q "test:"; then
            cargo nextest run --test '*' --workspace
          else
            echo "No integration test binaries found -- skipping"
          fi

  doc-tests:
    name: Doc Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --doc --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --lib --workspace
          cargo llvm-cov report --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  cargo-deny:
    name: License & Advisory Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories

  rtmx-health:
    name: RTMX Requirements Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rtmx
      - run: rtmx status

  binary-build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aegis-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/aegis
            target/${{ matrix.target }}/release/aegis.exe

  cross-compile-verify:
    name: Cross-compile Verification (${{ matrix.target }})
    needs: binary-build
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download musl binary
        uses: actions/download-artifact@v4
        with:
          name: aegis-${{ matrix.target }}
      - name: Verify musl binary is statically linked
        run: |
          chmod +x aegis
          echo "--- file output ---"
          file aegis
          file aegis | grep -qE "statically linked|static-pie linked"
          echo "PASS: musl binary is statically linked"
          echo "--- ldd output (expect 'not a dynamic executable') ---"
          ldd aegis 2>&1 || true
