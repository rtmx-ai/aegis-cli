# GitHub Actions CI for aegis-cli.
#
# The Makefile is the SINGLE SOURCE OF TRUTH for the pipeline. This workflow only
# sets up toolchains and then runs `make ci` — the exact same target the pre-push
# git hook runs locally (see scripts/install-hooks.sh). Nothing about the pipeline
# is duplicated here: if a step needs to change, it changes in the Makefile and
# both CI and the local hook pick it up. Parity is structural.
#
# Local pre-push runs the IDENTICAL command: `make ci`.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Build/test MATRIX over both ship targets (CLAUDE.md §2: linux-cpu + darwin-metal).
  #   - ubuntu-latest runs the FULL `make ci` incl. the linux-only netns egress
  #     gate, fail-closed (AIRGAP_STRICT=1). This is the real ITAR EGRESS=0 proof.
  #   - macos-latest runs `make ci-darwin` (= `make ci` minus the airgap step):
  #     scripts/verify-airgap.sh relies on `unshare -rn` / `ss`, both linux-only,
  #     so the netns proof CANNOT run on macOS. The macOS leg is for darwin-metal
  #     build/test parity ONLY — the egress proof is enforced on the linux enclave
  #     host and the linux CI leg, never claimed here.
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3"

      # CI toolchain setup (the network steps). `make ci`/`ci-darwin` themselves
      # run offline — vendored/std-lib build, egress gate, golden metrics — and
      # never fetch. golangci-lint and govulncheck are installed here so the
      # lint/vuln gates are ENFORCED in CI (locally they degrade to a note).
      - name: Install rtmx (toolchain setup)
        run: go install github.com/rtmx-ai/rtmx/cmd/rtmx@latest

      - name: Install golangci-lint (toolchain setup — enforces `make lint`)
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Install govulncheck (toolchain setup — enforces `make vuln`)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Single build step per leg: the same pipeline the pre-push hook runs.
      # Linux = full `make ci` (incl. fail-closed netns egress gate).
      - name: make ci (linux — single source of truth, full egress gate)
        if: runner.os == 'Linux'
        env:
          AIRGAP_STRICT: "1"
        run: make ci

      # macOS = `make ci-darwin` (full pipeline minus the linux-only airgap step).
      - name: make ci-darwin (macOS — darwin-metal build/test parity)
        if: runner.os == 'macOS'
        run: make ci-darwin

  # Publish the live README badge data (coverage, version) on every green main
  # build. Pushes shields "endpoint" JSON to the orphan `badges` branch — NOT
  # main — so it never triggers CI and never touches protected history. The
  # README endpoint badges read the raw JSON from that branch.
  badges:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Regenerate badge data (make badges — single source of truth)
        run: make badges

      - name: Publish to the orphan `badges` branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -eu
          tmp="$(mktemp -d)"
          cp badges/*.json "$tmp/"
          git fetch origin badges 2>/dev/null && git checkout badges \
            || git checkout --orphan badges
          git rm -rf . >/dev/null 2>&1 || true
          cp "$tmp"/*.json .
          git add -A ./*.json
          if git diff --cached --quiet; then
            echo "badges unchanged; nothing to publish"
          else
            git commit -m "ci: update live badges (coverage, version) [skip ci]"
            git push origin badges
          fi
