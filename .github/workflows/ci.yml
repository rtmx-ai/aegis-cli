name: CI

on:
  push:
    branches: [main]
  pull_request:

# INCIDENT MITIGATION (2026-03-28):
# GitHub's automated abuse detection flagged the rhino11 account after this
# workflow's release builds (LTO + codegen-units=1, musl + MSVC in parallel)
# resembled cryptocurrency mining. Mitigations applied:
# - Concurrency control prevents stacking builds (REQ-HDN-001)
# - Explicit timeout-minutes on every job (REQ-HDN-002)
# - Release builds gated to main branch only (REQ-HDN-003)
# - Cross-compilation serialized with max-parallel: 1 (REQ-HDN-004)
# - CI cargo profile uses thin LTO (REQ-HDN-005)
# Do not remove these constraints without reviewing rtmx-ai/ops.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# REQ-TEST-005: Required status checks for branch protection
# The following jobs MUST be listed as required status checks in GitHub
# branch protection rules for the `main` branch:
#   - Format
#   - Lint
#   - Unit Tests (ubuntu-latest)
#   - Unit Tests (windows-latest)
#   - Integration Tests
#   - Doc Tests
#   - Coverage
#   - License & Advisory Audit
#   - RTMX Requirements Health
#   - Build Gate
#
# NOTE: Build and Cross-compile jobs are gated to main-only pushes
# (REQ-HDN-003). The "Build Gate" job satisfies branch protection on PRs
# by passing through when builds are skipped.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --all

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --lib --workspace

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Run integration tests (skip if none exist)
        run: |
          if cargo nextest list --test '*' --workspace 2>/dev/null | grep -q "test:"; then
            cargo nextest run --test '*' --workspace
          else
            echo "No integration test binaries found -- skipping"
          fi

  doc-tests:
    name: Doc Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --doc --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --lib --workspace
          cargo llvm-cov report --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false

  cargo-deny:
    name: License & Advisory Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories

  rtmx-health:
    name: RTMX Requirements Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install rtmx
      - run: rtmx status

  build-gate:
    name: Build Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [format, lint, unit-tests, integration-tests, doc-tests, coverage, cargo-deny, rtmx-health]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"

  binary-build:
    name: Build (${{ matrix.target }})
    # REQ-HDN-003: Release builds only on main (not PRs).
    # These LTO builds are extremely CPU-intensive and triggered GitHub's
    # abuse detection on 2026-03-28. PR builds validate correctness only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [format, lint, unit-tests, integration-tests, doc-tests]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # REQ-HDN-004: Serialize cross-compilation to reduce peak CPU.
      max-parallel: 1
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y musl-tools
      # REQ-HDN-005: Use CI profile (thin LTO) instead of full release.
      - run: cargo build --profile ci --target ${{ matrix.target }}
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: aegis-${{ matrix.target }}
          retention-days: 7
          path: |
            target/${{ matrix.target }}/ci/aegis
            target/${{ matrix.target }}/ci/aegis.exe

  cross-compile-verify:
    name: Cross-compile Verification (${{ matrix.target }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: binary-build
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download musl binary
        uses: actions/download-artifact@v8
        with:
          name: aegis-${{ matrix.target }}
      - name: Verify musl binary is statically linked
        run: |
          chmod +x aegis
          echo "--- file output ---"
          file aegis
          file aegis | grep -qE "statically linked|static-pie linked"
          echo "PASS: musl binary is statically linked"
          echo "--- ldd output (expect 'not a dynamic executable') ---"
          ldd aegis 2>&1 || true
