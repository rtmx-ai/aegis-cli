# bundle-matrix — builds the per-platform Homebrew bundle tarballs (aegis + OpenCode + llama-server +
# the platform's pinned ripgrep) on NATIVE runners, one job per OS/arch. REL-009/010.
#
# This is the CANONICAL bundle build, reused two ways — one definition, one script
# (scripts/build-platform-bundle.sh), no duplication with release.yml:
#   - release.yml CALLS it (workflow_call) on a `v*` tag, then ingests the tarballs into the signed,
#     published release + the Homebrew formula.
#   - Run it STANDALONE (workflow_dispatch) to confirm the macOS/arm builds succeed on real runners
#     before cutting a tag.

name: bundle-matrix

on:
  workflow_call:
    inputs:
      version:
        description: "version / ref name (e.g. v1.2.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "version, no v prefix (e.g. 0.3.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    goos: linux,  goarch: amd64 }
          - { os: ubuntu-24.04-arm, goos: linux,  goarch: arm64 }
          - { os: macos-latest,     goos: darwin, goarch: arm64 }
          # macos-13 (Intel/darwin-amd64) dropped: those runners never allocate (stuck queued, GitHub
          # is winding Intel macOS down) and would hang release's needs:bundle. fill-formula prunes
          # darwin-amd64; Apple Silicon covers current Macs. Re-add via a self-hosted Intel runner.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3"
      - name: Install Bun (for the OpenCode build)
        run: |
          # Pin bun: CI installs latest by default, which re-resolves opencode v1.17.9's
          # lockfile and breaks build-opencode.sh's --frozen-lockfile (OC-003). 1.3.14 is the
          # version whose resolution matches the committed lockfile.
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # One script builds the full bundle (aegis + OpenCode + llama-server + the platform's pinned
      # rg) — each step inside (build-opencode/build-llama/stage-ripgrep/build-bundle) is tested.
      - name: Build the platform bundle
        run: scripts/build-platform-bundle.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" "${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/aegis-*.tar.gz
          if-no-files-found: error
