# bundle-matrix — multi-platform Homebrew bundle VALIDATION harness (REL-009/010).
#
# STATUS: release.yml now HAS the folded bundle matrix (REL-010) — on a `v*` tag it builds these
# tarballs and the `release` job publishes them. THIS workflow is the standalone validation
# harness: manually triggered (workflow_dispatch) so you can confirm the macOS/arm builds
# actually succeed on real runners BEFORE cutting a tag (release.yml's bundle job mirrors it,
# both calling scripts/build-platform-bundle.sh). Run this first; tag once it's green.
#
# REMAINING to validate (do NOT mark REL-010 done until confirmed on real runners):
#   1. [DONE] per-platform ripgrep: build-platform-bundle.sh stages + verifies the platform's rg.
#   2. llama-server on macOS builds with Metal (scripts/build-llama.sh is target-aware) — verify.
#   3. ubuntu-24.04-arm / macos-13 (Intel) runner availability in this org.
#   4. [DONE] signing: release.sh ingests the matrix tarballs into dist/ before SHA256SUMS, so
#      they are covered by the manifest + the offline signature in the single release job.
name: bundle-matrix (DRAFT)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "version, no v prefix (e.g. 0.3.0)"
        required: true

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    goos: linux,  goarch: amd64 }
          - { os: ubuntu-24.04-arm, goos: linux,  goarch: arm64 }
          - { os: macos-latest,     goos: darwin, goarch: arm64 }
          - { os: macos-13,         goos: darwin, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3"
      - name: Install Bun (for the OpenCode build)
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # One script builds the full bundle (aegis + OpenCode + llama-server + the platform's
      # pinned rg) — the SAME script release.yml's matrix calls, so the per-platform build logic
      # is DRY (REL-009). Each step inside (build-opencode/build-llama/stage-ripgrep/build-bundle)
      # is independently tested.
      - name: Build the platform bundle
        run: scripts/build-platform-bundle.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" "${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-${{ inputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/aegis-${{ inputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error
